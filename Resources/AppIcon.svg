<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3d46"/>
      <stop offset="100%" stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9ebf0"/>
      <stop offset="100%" stop-color="#c7cad2"/>
    </linearGradient>
    <linearGradient id="glow" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="680">
      <stop offset="0%" stop-color="#5ac8fa"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS-style squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- Trackpad surface -->
  <g filter="url(#soft)">
    <rect x="182" y="252" width="660" height="520" rx="56" ry="56" fill="url(#pad)"/>
    <rect x="182" y="252" width="660" height="520" rx="56" ry="56" fill="none" stroke="#9aa0ab" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- Three-finger straight swipe-up gesture -->
  <g fill="none" stroke="url(#glow)" stroke-linecap="round" stroke-width="34" opacity="0.95">
    <line x1="378" y1="660" x2="378" y2="410"/>
    <line x1="512" y1="660" x2="512" y2="380"/>
    <line x1="646" y1="660" x2="646" y2="410"/>
  </g>

  <!-- Arrowheads at the top of each line -->
  <g fill="none" stroke="url(#glow)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 340 452 L 378 400 L 416 452"/>
    <path d="M 474 422 L 512 370 L 550 422"/>
    <path d="M 608 452 L 646 400 L 684 452"/>
  </g>

  <!-- Fingertip dots at gesture start -->
  <g fill="#0a84ff">
    <circle cx="378" cy="674" r="28"/>
    <circle cx="512" cy="674" r="28"/>
    <circle cx="646" cy="674" r="28"/>
  </g>
</svg>
